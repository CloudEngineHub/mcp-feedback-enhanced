<!DOCTYPE html>
<html lang="{{ forced_language or 'zh-TW' }}"{% if forced_language %} data-forced-language="{{ forced_language }}"{% endif %} id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="stylesheet" href="/static/css/styles.css?v=2026102601">
    <style>
        :root {
            /* 深色主題顏色變數 */
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d30;
            --bg-tertiary: #252526;
            --surface-color: #333333;
            --text-primary: #cccccc;
            --text-secondary: #9e9e9e;
            --accent-color: #007acc;
            --accent-hover: #005a9e;
            --border-color: #464647;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --error-color: #f44336;
            --info-color: #2196f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 等待會話時的樣式 */
        .waiting-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .waiting-content {
            max-width: 600px;
            padding: 40px;
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .waiting-title {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .waiting-description {
            color: var(--text-secondary);
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .waiting-status {
            padding: 20px;
            background: rgba(0, 122, 204, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <!-- 等待會話的頁面 -->
    <div class="waiting-container" id="waitingContainer">
        <div class="waiting-content">
            <h1 class="waiting-title">MCP Feedback Enhanced</h1>
            <p class="waiting-description" data-i18n="waitingPage.description">
                Web UI 互動式回饋收集工具
            </p>
            <div class="waiting-status" data-i18n="waitingPage.status">
                等待 MCP 服務呼叫以建立回饋會話...
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/i18n.js?v=2026102601"></script>
    <script src="/static/js/modules/utils.js?v=2026102601"></script>
    <script src="/static/js/modules/settings-manager.js?v=2026102601"></script>
    <script>
        // 等待頁不啟動 FeedbackApp，只套用介面語言，順序與回饋頁相同
        window.i18nManager.init().then(function() {
            return new window.MCPFeedback.SettingsManager().loadSettings();
        });
    </script>
</body>
</html>
