name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint and type check
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy

    - name: Run tests
      run: uv run pytest
